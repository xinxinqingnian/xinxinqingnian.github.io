<script>

const articleData=
window.articleData||[];


let currentPage=1;

const pageSize=5;

let currentArticles=[];



function hideAllPages(){

document
.querySelectorAll(".page")
.forEach(i=>{

i.classList.remove(
"active"
)

})

}



function showArticlePage(){

hideAllPages();

document
.getElementById(
"articlePage"
)
.classList.add(
"active"
);

renderArticles()

}



function showPhotoPage(){

hideAllPages();

document
.getElementById(
"photoPage"
)
.classList.add(
"active"
)

}



function backHome(){

hideAllPages();

document
.getElementById(
"homePage"
)
.classList.add(
"active"
)

}



function renderArticles(){

const keyword=

document
.getElementById(
"searchInput"
)
.value
.toLowerCase();

const active=

document
.querySelector(
".category-tab.active"
)
.dataset.cate;


currentArticles=

articleData.filter(
a=>{

if(!a.check)
return false;

if(
active!=="all"
&&
a.cate!==active
)

return false;


return(

a.title
.toLowerCase()
.includes(keyword)

||

a.content
.toLowerCase()
.includes(keyword)

)

}

)


const start=

(currentPage-1)
*
pageSize;


const pageData=

currentArticles.slice(
start,
start+pageSize
);


let html="";


pageData.forEach(
(a,index)=>{

html+=`

<div
onclick="
openArticle(${index})
"

style="

background:white;

padding:20px;

border-radius:16px;

margin-bottom:15px;

cursor:pointer;

">

<h3>

${a.title}

</h3>

<br>

<div
style="color:#666">

作者：

${a.author||"匿名"}

</div>

<br>

<div>

${a.content.slice(
0,
100
)}

...

</div>

</div>

`

}


)


if(
html==""
){

html=`

<div
style="
background:white;
padding:40px;
text-align:center;
border-radius:16px;
">

暂无内容

</div>

`

}


document
.getElementById(
"articleListContainer"
)
.innerHTML=
html;

}


function openArticle(i){

const article=
currentArticles[i];

document
.getElementById(
"modalTitle"
)
innerText=
article.title;

document
.getElementById(
"modalContent"
)
innerText=
article.content;


document
.getElementById(
"articleModal"
)
.style.display=
"flex";

}



function closeModal(){

document
.getElementById(
"articleModal"
)
.style.display=
"none";

}



document
.addEventListener(
"click",
e=>{

if(
e.target.classList.contains(
"category-tab"
)
){

document
.querySelectorAll(
".category-tab"
)
.forEach(
t=>t.classList.remove(
"active"
)
)

e.target.classList.add(
"active"
)

renderArticles()

}

}
)


document
.getElementById(
"searchInput"
)
.addEventListener(
"input",
renderArticles
)

</script>
