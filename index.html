    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #fafafa;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
            color: #222;
            line-height: 1.7;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        body {
            padding: 15px;
            max-width: 820px;
            margin: 0 auto;
            padding-bottom: 120px;
        }
        button {
            cursor: pointer;
            border: none;
            background: none;
        }
        .page-header {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #d9251d;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }
        .site-title {
            font-size: 36px;
            font-weight: 900;
            color: #d9251d;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .site-slogan {
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }
        .contribute-wrapper {
            width: 100%;
            margin-bottom: 20px;
        }
        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            background: linear-gradient(90deg, #d9251d, #b91c1c);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .contact-btn:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }
        .sub-nav-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .sub-nav-btn {
            flex: 1;
            height: 48px;
            background-color: #fff;
            border: 2px solid #d9251d;
            color: #d9251d;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sub-nav-btn:hover {
            background-color: #d9251d;
            color: #fff;
        }

        /* ====== 红色经典书架样式 ====== */
        .bookshelf-module {
            background-color: #fff;
            border-radius: 18px;
            padding: 28px 24px;
            margin-bottom: 30px;
            border: 2px solid #d9251d;
            position: relative;
        }
        .bookshelf-title {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #d9251d;
            margin-bottom: 8px;
        }
        .bookshelf-sub {
            text-align: center;
            font-size: 14px;
            color: #999;
            margin-bottom: 18px;
        }
        .book-search-input {
            width: 100%;
            height: 48px;
            background-color: #f5f5f5;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 0 18px;
            font-size: 15px;
            margin-bottom: 18px;
            transition: border-color 0.3s ease;
        }
        .book-search-input:focus {
            outline: none;
            border-color: #d9251d;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        .book-card {
            background-color: #fef8f0;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px 18px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: inherit;
        }
        .book-card:hover {
            border-color: #d9251d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(217, 37, 29, 0.08);
        }
        .book-icon {
            font-size: 28px;
            color: #d9251d;
            flex-shrink: 0;
        }
        .book-info {
            flex: 1;
            min-width: 0;
        }
        .book-info .name {
            font-size: 16px;
            font-weight: 700;
            color: #222;
        }
        .book-info .author {
            font-size: 13px;
            color: #888;
        }
        .book-info .tag {
            display: inline-block;
            font-size: 11px;
            background-color: #fef2f2;
            color: #d9251d;
            padding: 1px 10px;
            border-radius: 12px;
            margin-top: 3px;
        }
        .book-empty-tip {
            text-align: center;
            color: #999;
            padding: 30px 0;
            font-size: 15px;
        }

        .article-list-header {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 18px;
            padding-left: 10px;
            border-left: 4px solid #d9251d;
        }
        .search-input {
            width: 100%;
            height: 50px;
            background-color: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 0 18px;
            font-size: 15px;
            margin-bottom: 18px;
        }
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background-color: #fff;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .category-tab {
            padding: 8px 16px;
            background-color: #f5f5f5;
            border: 1px solid #eee;
            color: #666;
            font-size: 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .category-tab.active {
            background-color: #d9251d;
            color: #fff;
            border-color: #d9251d;
        }
        #articleListContainer {
            display: block;
        }
        .article-card {
            background-color: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
        }
        .article-card:hover {
            transform: translateY(-3px);
            border-color: #d9251d;
        }
        .article-card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .article-card-meta {
            display: flex;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px dashed #eee;
            font-size: 13px;
            color: #666;
        }
        .article-category-tag {
            padding: 3px 8px;
            background-color: #fef2f2;
            color: #d9251d;
            font-size: 12px;
            border-radius: 6px;
        }
        .article-card-excerpt {
            font-size: 15px;
            color: #555;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pagination-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 30px;
            align-items: center;
        }
        .pagination-btn {
            padding: 8px 20px;
            background-color: #fff;
            border: 1px solid #d9251d;
            color: #d9251d;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .random-btn {
            margin-left: auto;
            padding: 8px 16px;
            background-color: #d9251d;
            color: #fff;
            border: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .random-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .empty-article-tip {
            background-color: #fff;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #999;
        }
        .article-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 15px;
        }
        .article-modal.show {
            display: flex;
        }
        .modal-container {
            background-color: #fff;
            width: 100%;
            max-width: 740px;
            border-radius: 18px;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 24px;
            background-color: #fef2f2;
            border-bottom: 1px solid #eee;
        }
        .modal-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .modal-body {
            padding: 28px 24px;
            font-size: 16px;
            line-height: 1.9;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .modal-footer {
            padding: 20px 24px;
            text-align: right;
        }
        .modal-close-btn {
            padding: 12px 26px;
            background-color: #d9251d;
            color: #fff;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .back-top-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 50px;
            height: 50px;
            background-color: #d9251d;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .back-top-btn.show {
            opacity: 1;
            pointer-events: auto;
        }
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #d9251d;
            z-index: 10000;
            transition: width 0.1s;
        }
        .page-footer {
            margin-top: 40px;
            padding-top: 26px;
            border-top: 1px solid #eee;
            text-align: center;
            color: #999;
            font-size: 14px;
        }
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid #d9251d;
            color: #d9251d;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            transition: all 0.2s ease;
        }
        .back-home-btn:hover {
            background-color: #d9251d;
            color: #fff;
        }
        .photo-card {
            background-color: #fff;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
        }
        .photo-card:hover {
            transform: translateY(-3px);
            border-color: #d9251d;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .photo-card-info {
            padding: 16px 18px;
        }
        .photo-card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #222;
        }
        .photo-card-desc {
            font-size: 14px;
            color: #666;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            cursor: pointer;
        }
        .photo-modal.show {
            display: flex;
        }
        .photo-modal img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            object-fit: contain;
        }
        .photo-modal-close {
            position: fixed;
            top: 20px;
            right: 25px;
            width: 44px;
            height: 44px;
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.2s ease;
            border: none;
        }
        .photo-modal-close:hover {
            background-color: rgba(255,255,255,0.4);
        }
        .photo-modal-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            text-align: center;
            z-index: 10000;
            max-width: 80vw;
        }
        .photo-modal-info .title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .photo-modal-info .desc {
            font-size: 14px;
            opacity: 0.85;
        }

        /* 免责声明 */
        .disclaimer-box {
            background-color: #fff3e0;
            border-left: 4px solid #d9251d;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }
        .disclaimer-box strong {
            color: #d9251d;
        }

        @media (max-width: 480px) {
            .site-title { font-size: 28px; }
            .article-card-title { font-size: 18px; }
            .modal-title { font-size: 20px; }
            .contact-btn { height: 50px; font-size: 17px; }
            .category-tab { padding: 6px 12px; font-size: 13px; }
            .pagination-btn { padding: 6px 14px; font-size: 13px; }
            .back-top-btn { width: 44px; height: 44px; font-size: 20px; }
            .photo-card img { height: 180px; }
            .photo-modal-close { top: 15px; right: 15px; width: 38px; height: 38px; font-size: 22px; }
            .book-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 360px) {
            body { padding: 10px; }
            .site-title { font-size: 24px; }
        }
        @media (min-width: 1024px) {
            body {
                max-width: 1400px;
                padding: 20px 40px;
            }
            #articleListContainer {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 28px;
            }
            .article-card {
                margin-bottom: 0;
            }
            .article-card:hover {
                transform: translateY(-6px);
                box-shadow: 0 12px 28px rgba(0,0,0,0.1);
            }
            #photoGridContainer {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 28px;
            }
            .photo-card {
                margin-bottom: 0;
            }
            .photo-card:hover {
                transform: translateY(-6px);
                box-shadow: 0 12px 28px rgba(0,0,0,0.1);
            }
            .pagination-container {
                margin-top: 50px;
            }
            .modal-container {
                max-width: 920px;
            }
            .sub-nav-buttons {
                max-width: 600px;
                margin-left: auto;
                margin-right: auto;
            }
            .category-tabs {
                justify-content: center;
            }
            .article-card {
                padding: 28px;
            }
            .article-card-title {
                font-size: 22px;
            }
            .search-input {
                max-width: 600px;
                margin-left: auto;
                margin-right: auto;
            }
            .contribute-wrapper {
                max-width: 600px;
                margin-left: auto;
                margin-right: auto;
            }
            .bookshelf-module {
                padding: 36px 32px;
            }
            .book-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (min-width: 1600px) {
            #articleListContainer {
                grid-template-columns: repeat(3, 1fr);
            }
            #photoGridContainer {
                grid-template-columns: repeat(3, 1fr);
            }
            body {
                max-width: 1600px;
            }
            .book-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

        <h2 class="article-list-header">📖 思想交流区</h2>
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索文章、观点或关键词">

        <div class="category-tabs">
            <div class="category-tab active" data-cate="all">全部内容</div>
            <div class="category-tab" data-cate="青年观点">青年观点</div>
            <div class="category-tab" data-cate="批判揭露">批判揭露</div>

        <div class="article-modal" id="articleModal">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 class="modal-title" id="modalArticleTitle"></h3>
                    <div class="modal-meta" style="display:flex; gap:15px;">
                        <span id="modalArticleAuthor"></span>
                        <span id="modalArticleCategory"></span>
                    </div>

                    <button class="modal-close-btn" id="closeModalBtn">关闭阅读</button>
                </div>
            </div>

    <!-- ==================== 自主创作区 ==================== -->
    <div class="page-section" id="photoPage">
        <header class="page-header">
            <div style="display:flex;align-items:center;justify-content:center;gap:15px;">
                <svg width="75" height="75" viewBox="0 0 200 200">
                    <rect x="10" y="10" width="180" height="180" rx="8" fill="none" stroke="#d9251d" stroke-width="6"/>

                    <line x1="110" y1="120" x2="170" y2="120" stroke="#d9251d" stroke-width="3"/>

        <button class="back-home-btn" id="backHomeFromPhotoBtn">← 返回首页</button>

        <div class="contribute-wrapper">
            <a href="mailto:qqppqqppww@163.com" class="contact-btn">🎨 我要投稿 · 自主创作</a>
        </div>

        <h2 class="article-list-header">🎨 自主创作区</h2>

        <div id="photoGridContainer"></div>

        <div class="photo-modal" id="photoModal">
            <button class="photo-modal-close" id="photoModalClose">✕</button>
            <img id="photoModalImg" src="" alt="">
            <div class="photo-modal-info" id="photoModalInfo">
                <div class="title" id="photoModalTitle"></div>
                <div class="desc" id="photoModalDesc"></div>

    <footer class="page-footer">
        <div class="copyright">© 2026 新新青年</div>
        <div class="footer-slogan">青年者，国家之魂；守护青年，即是守护未来</div>

    <div class="back-top-btn" id="backTopBtn">↑</div>

    <!-- ====== 加载外部数据文件 ====== -->
    <script src="articleData.js"></script>
    <script src="imageData.js"></script>
    <script src="bookData.js"></script>

    <script>
        // ====================== 读取外部数据 ======================
        var bookData = window.bookData || [];
        var articleData = window.articleData || [];
        var imageData = window.imageData || [];

        // ====================== DOM 元素 ======================
        var homePage = document.getElementById('homePage');
        var goArticlePageBtn = document.getElementById('goArticlePageBtn');
        var goPhotoPageBtn = document.getElementById('goPhotoPageBtn');

        var articlePage = document.getElementById('articlePage');
        var backHomeFromArticleBtn = document.getElementById('backHomeFromArticleBtn');
        var articleListContainer = document.getElementById('articleListContainer');
        var searchInput = document.getElementById('searchInput');
        var categoryTabs = document.querySelectorAll('#articlePage .category-tab');
        var articleModal = document.getElementById('articleModal');
        var closeModalBtn = document.getElementById('closeModalBtn');
        var randomBtn = document.getElementById('randomBtn');
        var backTopBtn = document.getElementById('backTopBtn');
        var readingProgress = document.getElementById('readingProgress');

        var photoPage = document.getElementById('photoPage');
        var backHomeFromPhotoBtn = document.getElementById('backHomeFromPhotoBtn');
        var photoGridContainer = document.getElementById('photoGridContainer');
        var photoModal = document.getElementById('photoModal');
        var photoModalImg = document.getElementById('photoModalImg');
        var photoModalTitle = document.getElementById('photoModalTitle');
        var photoModalDesc = document.getElementById('photoModalDesc');
        var photoModalClose = document.getElementById('photoModalClose');

        var bookGrid = document.getElementById('bookGrid');
        var bookSearchInput = document.getElementById('bookSearchInput');

        var currentPage = 1;
        var pageSize = 5;
        var currentFilteredArticles = [];

        // ====================== 工具函数 ======================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
            });
        }

        // ====================== 页面切换 ======================
        function showPage(pageId) {
            var sections = document.querySelectorAll('.page-section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].classList.remove('active');
            }
            document.getElementById(pageId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            readingProgress.style.width = '0%';
        }

        goArticlePageBtn.addEventListener('click', function() {
            showPage('articlePage');
            renderArticleList();
        });

        goPhotoPageBtn.addEventListener('click', function() {
            showPage('photoPage');
            renderPhotos();
        });

        backHomeFromArticleBtn.addEventListener('click', function() {
            showPage('homePage');
        });

        backHomeFromPhotoBtn.addEventListener('click', function() {
            showPage('homePage');
        });

        // ====================== 书籍渲染（带搜索功能） ======================
        function renderBooks() {
            if (!bookData || bookData.length === 0) {
                bookGrid.innerHTML = '<div class="book-empty-tip">📚 暂无书籍数据</div>';
                return;
            }

            var keyword = bookSearchInput.value.trim().toLowerCase();
            var filtered = bookData.filter(function(item) {
                if (!item.name) return false;
                return item.name.toLowerCase().includes(keyword) ||
                       (item.author || '').toLowerCase().includes(keyword) ||
                       (item.tag || '').toLowerCase().includes(keyword);
            });

            if (filtered.length === 0) {
                bookGrid.innerHTML = '<div class="book-empty-tip">📭 未找到相关书籍</div>';
                return;
            }

            var html = '';
            filtered.forEach(function(book) {
                var icon = book.icon || '📕';
                var url = book.url || '#';
                html += '<a class="book-card" href="' + escapeHtml(url) + '" target="_blank">' +
                            '<div class="book-icon">' + icon + '</div>' +
                            '<div class="book-info">' +
                                '<div class="name">' + escapeHtml(book.name) + '</div>' +
                                '<div class="author">' + escapeHtml(book.author || '') + '</div>' +
                                (book.tag ? '<div class="tag">' + escapeHtml(book.tag) + '</div>' : '') +
                            '</div>' +
                        '</a>';
            });
            bookGrid.innerHTML = html;
        }

        // 书籍搜索框监听（确保能用）
        if (bookSearchInput) {
            bookSearchInput.addEventListener('input', renderBooks);
        }

        // ====================== 文章列表渲染 ======================
        function renderArticleList() {
            var keyword = searchInput.value.trim().toLowerCase();
            var activeTab = document.querySelector('#articlePage .category-tab.active');
            var activeCategory = activeTab ? activeTab.dataset.cate : 'all';

            currentFilteredArticles = articleData.filter(function(item) {
                if (!item.check) return false;
                if (activeCategory !== 'all' && item.cate !== activeCategory) return false;
                return item.title.toLowerCase().includes(keyword) ||
                       item.content.toLowerCase().includes(keyword) ||
                       (item.author || '').toLowerCase().includes(keyword);
            });

            var totalPages = Math.ceil(currentFilteredArticles.length / pageSize);
            if (currentPage > totalPages) currentPage = totalPages || 1;
            if (currentPage < 1) currentPage = 1;

            var start = (currentPage - 1) * pageSize;
            var pageArticles = currentFilteredArticles.slice(start, start + pageSize);

            if (currentFilteredArticles.length === 0) {
                articleListContainer.innerHTML = '<div class="empty-article-tip">暂无内容，期待你的第一篇投稿</div>';
                document.getElementById('paginationContainer').style.display = 'none';
                return;
            }
            document.getElementById('paginationContainer').style.display = 'flex';

            var html = '';
            pageArticles.forEach(function(article, idx) {
                var originalIndex = start + idx;
                html += '<div class="article-card" data-index="' + originalIndex + '">' +
                            '<h3 class="article-card-title">' + escapeHtml(article.title) + '</h3>' +
                            '<div class="article-card-meta">' +
                                '<span>作者：' + escapeHtml(article.author || '匿名') + '</span>' +
                                '<span class="article-category-tag">' + escapeHtml(article.cate) + '</span>' +
                            '</div>' +
                            '<div class="article-card-excerpt">' + escapeHtml(article.content.slice(0, 130)) + (article.content.length > 130 ? '...' : '') + '</div>' +
                        '</div>';
            });
            articleListContainer.innerHTML = html;

            document.getElementById('pageInfo').innerText = '第 ' + currentPage + ' / ' + totalPages + ' 页';
            document.getElementById('prevPageBtn').disabled = (currentPage <= 1);
            document.getElementById('nextPageBtn').disabled = (currentPage >= totalPages);

            var cards = document.querySelectorAll('#articlePage .article-card');
            for (var i = 0; i < cards.length; i++) {
                (function(card) {
                    card.addEventListener('click', function() {
                        var data = currentFilteredArticles[parseInt(card.dataset.index)];
                        if (!data) return;
                        document.getElementById('modalArticleTitle').innerText = data.title;
                        document.getElementById('modalArticleAuthor').innerText = '作者：' + (data.author || '匿名');
                        document.getElementById('modalArticleCategory').innerText = '分类：' + data.cate;
                        document.getElementById('modalArticleContent').innerText = data.content;
                        articleModal.classList.add('show');
                        document.body.style.overflow = 'hidden';
                    });
                })(cards[i]);
            }
        }

        function resetAndRender() {
            currentPage = 1;
            renderArticleList();
        }

        function goPrevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderArticleList();
                document.getElementById('articlePage').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function goNextPage() {
            var totalPages = Math.ceil(currentFilteredArticles.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderArticleList();
                document.getElementById('articlePage').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        searchInput.addEventListener('input', resetAndRender);

        for (var i = 0; i < categoryTabs.length; i++) {
            (function(tab) {
                tab.addEventListener('click', function() {
                    for (var j = 0; j < categoryTabs.length; j++) {
                        categoryTabs[j].classList.remove('active');
                    }
                    tab.classList.add('active');
                    resetAndRender();
                });
            })(categoryTabs[i]);
        }

        document.getElementById('prevPageBtn').addEventListener('click', goPrevPage);
        document.getElementById('nextPageBtn').addEventListener('click', goNextPage);

        // ====================== 随机阅读 ======================
        randomBtn.addEventListener('click', function() {
            var checked = articleData.filter(function(item) { return item.check; });
            if (checked.length === 0) return;
            var rand = Math.floor(Math.random() * checked.length);
            var article = checked[rand];
            document.getElementById('modalArticleTitle').innerText = article.title;
            document.getElementById('modalArticleAuthor').innerText = '作者：' + (article.author || '匿名');
            document.getElementById('modalArticleCategory').innerText = '分类：' + article.cate;
            document.getElementById('modalArticleContent').innerText = article.content;
            articleModal.classList.add('show');
            document.body.style.overflow = 'hidden';
        });

        // ====================== 文章弹窗关闭 ======================
        closeModalBtn.addEventListener('click', function() {
            articleModal.classList.remove('show');
            document.body.style.overflow = 'auto';
        });

        articleModal.addEventListener('click', function(e) {
            if (e.target === articleModal) {
                articleModal.classList.remove('show');
                document.body.style.overflow = 'auto';
            }
        });

        // ====================== 照片渲染 ======================
        function renderPhotos() {
            if (!imageData || imageData.length === 0) {
                photoGridContainer.innerHTML = '<div class="empty-article-tip">🎨 暂无创作内容，期待你的投稿</div>';
                return;
            }

            var html = '';
            imageData.forEach(function(photo, index) {
                html += '<div class="photo-card" data-index="' + index + '">' +
                            '<img src="' + escapeHtml(photo.url) + '" alt="' + escapeHtml(photo.title) + '" loading="lazy">' +
                            '<div class="photo-card-info">' +
                                '<div class="photo-card-title">' + escapeHtml(photo.title) + '</div>' +
                                '<div class="photo-card-desc">' + escapeHtml(photo.description || '') + '</div>' +
                            '</div>' +
                        '</div>';
            });
            photoGridContainer.innerHTML = html;

            var cards = document.querySelectorAll('#photoPage .photo-card');
            for (var i = 0; i < cards.length; i++) {
                (function(card) {
                    card.addEventListener('click', function() {
                        var data = imageData[parseInt(card.dataset.index)];
                        if (!data) return;
                        photoModalImg.src = data.url;
                        photoModalTitle.textContent = data.title;
                        photoModalDesc.textContent = data.description || '';
                        photoModal.classList.add('show');
                        document.body.style.overflow = 'hidden';
                    });
                })(cards[i]);
            }
        }

        // ====================== 照片弹窗关闭 ======================
        function closePhotoModal() {
            photoModal.classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        photoModalClose.addEventListener('click', function(e) {
            e.stopPropagation();
            closePhotoModal();
        });

        photoModal.addEventListener('click', function(e) {
            if (e.target === photoModal) {
                closePhotoModal();
            }
        });

        // ====================== 键盘快捷键 ======================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && articleModal.classList.contains('show')) {
                articleModal.classList.remove('show');
                document.body.style.overflow = 'auto';
            }
            if (e.key === 'Escape' && photoModal.classList.contains('show')) {
                closePhotoModal();
            }
            if (articlePage.classList.contains('active')) {
                if (e.key === 'ArrowLeft' && !document.getElementById('prevPageBtn').disabled) {
                    e.preventDefault();
                    goPrevPage();
                }
                if (e.key === 'ArrowRight' && !document.getElementById('nextPageBtn').disabled) {
                    e.preventDefault();
                    goNextPage();
                }
            }
        });

        // ====================== 阅读进度条 + 回到顶部 ======================
        window.addEventListener('scroll', function() {
            var winScroll = document.documentElement.scrollTop;
            var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var scrolled = (winScroll / height) * 100;
            readingProgress.style.width = scrolled + '%';
            backTopBtn.classList.toggle('show', window.scrollY > 300);
        });

        backTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ====================== 初始化 ======================
        window.addEventListener('DOMContentLoaded', function() {
            showPage('homePage');
            renderBooks();
            renderArticleList();
            renderPhotos();
        });
    </script>
</body>
</html>
