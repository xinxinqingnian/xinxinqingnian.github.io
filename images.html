<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>新新青年 - 照片区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #fafafa;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
            color: #222;
            line-height: 1.7;
            overflow-x: hidden;
        }
        body {
            padding: 15px;
            max-width: 820px;
            margin: 0 auto;
            padding-bottom: 120px;
        }

        /* 顶部区域 */
        .page-header {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #d9251d;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }
        .site-title {
            font-size: 36px;
            font-weight: 900;
            color: #d9251d;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .site-slogan {
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }

        /* 返回按钮 */
        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid #d9251d;
            color: #d9251d;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            transition: all 0.2s ease;
        }
        .back-home-btn:hover {
            background-color: #d9251d;
            color: #fff;
        }

        /* 投稿按钮 */
        .contribute-wrapper {
            width: 100%;
            margin-bottom: 25px;
        }
        .contribute-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            background: linear-gradient(90deg, #d9251d, #b91c1c);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .contribute-btn:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        /* 照片标题 */
        .section-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 18px;
            padding-left: 10px;
            border-left: 4px solid #d9251d;
        }

        /* 照片网格 */
        #photoContainer {
            display: block;
        }
        .photo-card {
            background-color: #fff;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
        }
        .photo-card:hover {
            transform: translateY(-3px);
            border-color: #d9251d;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .photo-card-info {
            padding: 16px 18px;
        }
        .photo-card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #222;
        }
        .photo-card-desc {
            font-size: 14px;
            color: #666;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 空状态 */
        .empty-tip {
            background-color: #fff;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #999;
            font-size: 15px;
        }

        /* 照片放大弹窗 */
        .photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            cursor: pointer;
        }
        .photo-modal.show {
            display: flex;
        }
        .photo-modal img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            object-fit: contain;
        }
        .photo-modal-close {
            position: fixed;
            top: 20px;
            right: 25px;
            width: 44px;
            height: 44px;
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.2s ease;
            border: none;
        }
        .photo-modal-close:hover {
            background-color: rgba(255,255,255,0.4);
        }
        .photo-modal-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            text-align: center;
            z-index: 10000;
            max-width: 80vw;
        }
        .photo-modal-info .title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .photo-modal-info .desc {
            font-size: 14px;
            opacity: 0.85;
        }

        /* PC端网格 */
        @media (min-width: 1024px) {
            body {
                max-width: 1400px;
                padding: 20px 40px;
            }
            #photoContainer {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 28px;
            }
            .photo-card {
                margin-bottom: 0;
            }
            .photo-card:hover {
                transform: translateY(-6px);
                box-shadow: 0 12px 28px rgba(0,0,0,0.1);
            }
            .contribute-wrapper {
                max-width: 600px;
                margin-left: auto;
                margin-right: auto;
            }
        }
        @media (min-width: 1600px) {
            #photoContainer {
                grid-template-columns: repeat(3, 1fr);
            }
            body {
                max-width: 1600px;
            }
        }

        /* 移动端 */
        @media (max-width: 480px) {
            .site-title { font-size: 28px; }
            .contribute-btn { height: 50px; font-size: 17px; }
            .photo-card img { height: 180px; }
            .photo-modal-info { bottom: 20px; padding: 10px 18px; }
            .photo-modal-close { top: 15px; right: 15px; width: 38px; height: 38px; font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- 顶部图标与宣言 -->
    <header class="page-header">
        <div style="display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;">
            <svg width="75" height="75" viewBox="0 0 200 200">
                <rect x="10" y="10" width="180" height="180" rx="8" fill="none" stroke="#d9251d" stroke-width="6"/>
                <rect x="20" y="20" width="160" height="160" rx="5" fill="none" stroke="#d9251d" stroke-width="3"/>
                <line x1="30" y1="45" x2="170" y2="45" stroke="#d9251d" stroke-width="4"/>
                <line x1="30" y1="58" x2="170" y2="58" stroke="#d9251d" stroke-width="2"/>
                <text x="100" y="105" font-size="45" font-weight="900" fill="#d9251d" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif">新新</text>
                <text x="100" y="155" font-size="45" font-weight="900" fill="#d9251d" text-anchor="middle" font-family="SimHei,Microsoft YaHei,sans-serif">青年</text>
                <line x1="110" y1="80" x2="170" y2="80" stroke="#d9251d" stroke-width="3"/>
                <line x1="110" y1="100" x2="170" y2="100" stroke="#d9251d" stroke-width="3"/>
                <line x1="110" y1="120" x2="170" y2="120" stroke="#d9251d" stroke-width="3"/>
                <line x1="110" y1="140" x2="170" y2="140" stroke="#d9251d" stroke-width="3"/>
            </svg>
            <h1 class="site-title">新新青年</h1>
        </div>
        <p class="site-slogan">为青年发声 · 揭露体系沉疴 · 守护国家与民族的未来</p>
    </header>

    <!-- 返回首页按钮 -->
    <a href="index.html" class="back-home-btn">← 返回首页</a>

    <!-- 投稿照片按钮 -->
    <div class="contribute-wrapper">
        <a href="mailto:qqppqqppww@163.com" class="contribute-btn">📷 我要发声 · 投稿照片</a>
    </div>

    <!-- 照片区标题 -->
    <h2 class="section-title">📷 青年影像 · 照片广场</h2>

    <!-- 照片展示区域 -->
    <div id="photoContainer"></div>

    <!-- 照片放大弹窗 -->
    <div class="photo-modal" id="photoModal">
        <button class="photo-modal-close" id="photoModalClose">✕</button>
        <img id="photoModalImg" src="" alt="">
        <div class="photo-modal-info" id="photoModalInfo">
            <div class="title" id="photoModalTitle"></div>
            <div class="desc" id="photoModalDesc"></div>
        </div>
    </div>

    <script>
        // ====================== 照片数据 ======================
        window.imageData = [
    {
        "url": "https://example.com/photo1.jpg",
        "title": "青年集会现场",
        "description": "2025年青年发声活动现场拍摄"
    },
    {
        "url": "https://example.com/photo2.jpg",
        "title": "晨读时光",
        "description": "某中学清晨教室场景"
    }
];

        // ====================== 渲染照片 ======================
        const photoContainer = document.getElementById('photoContainer');
        const photoModal = document.getElementById('photoModal');
        const photoModalImg = document.getElementById('photoModalImg');
        const photoModalTitle = document.getElementById('photoModalTitle');
        const photoModalDesc = document.getElementById('photoModalDesc');
        const photoModalClose = document.getElementById('photoModalClose');

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
            });
        }

        function renderPhotos() {
            if (!window.imageData || window.imageData.length === 0) {
                photoContainer.innerHTML = '<div class="empty-tip">📷 暂无照片，期待你的投稿</div>';
                return;
            }

            let html = '';
            window.imageData.forEach((photo, index) => {
                html += `
                    <div class="photo-card" data-index="${index}">
                        <img src="${escapeHtml(photo.url)}" alt="${escapeHtml(photo.title)}" loading="lazy">
                        <div class="photo-card-info">
                            <div class="photo-card-title">${escapeHtml(photo.title)}</div>
                            <div class="photo-card-desc">${escapeHtml(photo.description || '')}</div>
                        </div>
                    </div>
                `;
            });
            photoContainer.innerHTML = html;

            // 点击照片放大
            document.querySelectorAll('.photo-card').forEach(card => {
                card.addEventListener('click', () => {
                    const data = window.imageData[parseInt(card.dataset.index)];
                    if (!data) return;
                    photoModalImg.src = data.url;
                    photoModalTitle.textContent = data.title;
                    photoModalDesc.textContent = data.description || '';
                    photoModal.classList.add('show');
                    document.body.style.overflow = 'hidden';
                });
            });
        }

        // 关闭弹窗
        function closePhotoModal() {
            photoModal.classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        photoModalClose.addEventListener('click', (e) => {
            e.stopPropagation();
            closePhotoModal();
        });

        photoModal.addEventListener('click', (e) => {
            if (e.target === photoModal) {
                closePhotoModal();
            }
        });

        // 键盘 ESC 关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && photoModal.classList.contains('show')) {
                closePhotoModal();
            }
        });

        // 初始化渲染
        window.addEventListener('DOMContentLoaded', renderPhotos);
    </script>

</body>
      </html>
